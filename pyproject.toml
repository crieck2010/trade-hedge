[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-hedge"
version = "0.1.0"
description = "The auto-hedging loop: exposure monitor + hedge proposals that keep a portfolio inside its risk limits (paper-trading only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "hedging", "risk-management", "portfolio", "quantitative-finance", "paper-trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-hedge = "trade_hedge.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-hedge"
Repository = "https://github.com/crieck2010/trade-hedge"

[tool.setuptools.packages.find]
where = ["src"]
